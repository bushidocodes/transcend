packages:
  - '.'

overrides:
  # GHSA-w5hq-g745-h8pq - uuid buffer bounds via Sequelize.
  uuid: ^11.1.1
  # GHSA-r28c-9q8g-f849 - PostCSS path traversal via sourceMappingURL.
  postcss: '>=8.5.18'

# aframe pulls three-bmfont-text from a git URL (exotic subdep).
blockExoticSubdeps: false

# aframe-gif-shader@0.9.1 still declares aframe@^0.9.0 (pre-1.x renumbering);
# the shader works on modern A-Frame (was npm legacy-peer-deps=true).
peerDependencyRules:
  allowedVersions:
    aframe: '*'

allowBuilds:
  esbuild: true
